name: Check channel network access

on:
  workflow_dispatch:
    inputs:
      channels:
        description: "Optional comma-separated probe IDs; blank runs all probes"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r src/requirements.txt
      - name: Probe public endpoints
        id: probe
        env:
          PROBE_CHANNELS: ${{ inputs.channels }}
        run: |
          set -o pipefail
          if [ -n "$PROBE_CHANNELS" ]; then
            IFS=',' read -ra CHANNEL_ARGS <<< "$PROBE_CHANNELS"
            python src/script/check_channel_network.py "${CHANNEL_ARGS[@]}" 2>&1 | tee channel-network-check.txt
          else
            python src/script/check_channel_network.py 2>&1 | tee channel-network-check.txt
          fi
      - name: Write probe summary
        if: always()
        run: |
          {
            echo "## 新增渠道网络探测"
            echo
            echo '```text'
            cat channel-network-check.txt
            echo '```'
            echo
            echo "失败只表示 GitHub runner 当前不可达，不自动启用 Playwright。"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: channel-network-check
          path: channel-network-check.txt
          if-no-files-found: error
