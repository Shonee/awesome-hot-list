name: Render Daily Dashboard

on:
  schedule:
    # Beijing 00:40 = previous day 16:40 UTC.
    - cron: "40 16 * * *"
  push:
    branches: ["master"]
    paths:
      - "src/template/site.html"
      - "src/script/render.py"
      - "src/hotlist/**"
      - ".github/workflows/render-daily.yml"
  workflow_dispatch:

concurrency:
  group: hotlist-repository-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: app

      - name: Checkout rolling data
        uses: actions/checkout@v4
        with:
          ref: data-pages
          path: runtime

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/src/requirements.txt

      - name: Install render dependencies
        run: python -m pip install -r app/src/requirements.txt

      - name: Render current and previous reports
        run: >-
          python "$GITHUB_WORKSPACE/app/src/script/render.py"
          --data-root "$GITHUB_WORKSPACE/runtime"

      - name: Commit dashboard to data-pages
        run: |
          git -C runtime config user.name "github-actions[bot]"
          git -C runtime config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C runtime add site/index.html site/data/latest.json site/data/reports/
          if git -C runtime diff --cached --quiet; then
            echo "no dashboard change"
            exit 0
          fi
          git -C runtime commit -m "chore: render hotlist dashboard $(date -u +'%Y-%m-%d')"
          git -C runtime pull --rebase origin data-pages
          git -C runtime push origin HEAD:data-pages
