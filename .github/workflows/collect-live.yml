name: Collect live news

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: hotlist-repository-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: app

      - name: Checkout rolling data
        uses: actions/checkout@v7
        with:
          ref: data-pages
          path: runtime

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/src/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r app/src/requirements.txt

      - name: Collect live rankings
        id: collect
        continue-on-error: true
        run: >-
          python "$GITHUB_WORKSPACE/app/src/script/collect.py" live --surface live
          --data-root "$GITHUB_WORKSPACE/runtime"

      - name: Commit live snapshots to data-pages
        if: always()
        run: |
          git -C runtime config user.name "github-actions[bot]"
          git -C runtime config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C runtime add archived/ site/data/live.json
          if git -C runtime diff --cached --quiet; then
            echo "no live data changed"
            exit 0
          fi
          git -C runtime commit -m "chore: update live news"
          git -C runtime pull --rebase origin data-pages
          git -C runtime push origin HEAD:data-pages

      - name: Enforce collection health
        if: always()
        run: |
          if [ "${{ steps.collect.outcome }}" != "success" ]; then
            echo "all attempted live channels failed; generated failure state was persisted"
            exit 1
          fi
