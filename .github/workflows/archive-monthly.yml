name: Archive old hot-list data to GitHub Releases

run-name: >-
  Archive ${{ inputs.month || 'auto' }} / ${{ inputs.channels || 'all' }} /
  ${{ inputs.pack_mode || 'per-channel' }}

on:
  schedule:
    # GitHub cron uses UTC. This is 03:20 Asia/Shanghai on the second day.
    - cron: "20 19 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "auto, YYYY-MM, or inclusive range YYYY-MM..YYYY-MM"
        required: true
        default: "auto"
        type: string
      channels:
        description: "all or comma-separated directory names under archived/"
        required: true
        default: "all"
        type: string
      pack_mode:
        description: "Create one asset per channel or one combined asset"
        required: true
        default: "per-channel"
        type: choice
        options:
          - per-channel
          - combined
      cleanup_mode:
        description: "Create a cleanup PR (recommended) or push deletion directly"
        required: true
        default: "pr"
        type: choice
        options:
          - pr
          - direct
      retention_months:
        description: "Keep the current month plus this many complete months"
        required: true
        default: "1"
        type: string
      dry_run:
        description: "Build and verify locally without creating releases or deleting files"
        required: true
        default: true
        type: boolean

concurrency:
  # Add this exact group to every collector workflow that writes archived/.
  group: archive-data-writer
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  TZ: Asia/Shanghai
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  WORK_DIR: .archive-work
  MAX_UNCOMPRESSED_PART_BYTES: "1500000000"

jobs:
  archive:
    name: Package, publish, verify, and clean
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve and validate inputs
        shell: bash
        env:
          REQUESTED_MONTH: ${{ inputs.month || 'auto' }}
          REQUESTED_CHANNELS: ${{ inputs.channels || 'all' }}
          REQUESTED_PACK_MODE: ${{ inputs.pack_mode || 'per-channel' }}
          REQUESTED_CLEANUP_MODE: ${{ inputs.cleanup_mode || 'pr' }}
          REQUESTED_RETENTION_MONTHS: ${{ inputs.retention_months || '1' }}
          REQUESTED_DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
        run: |
          set -euo pipefail

          [[ "$REQUESTED_MONTH" =~ ^(auto|[0-9]{4}-[0-9]{2}|[0-9]{4}-[0-9]{2}\.\.[0-9]{4}-[0-9]{2})$ ]] || {
            echo "Invalid month input: $REQUESTED_MONTH" >&2
            exit 2
          }
          [[ "$REQUESTED_CHANNELS" == "all" || "$REQUESTED_CHANNELS" =~ ^[A-Za-z0-9_-]+(,[A-Za-z0-9_-]+)*$ ]] || {
            echo "Invalid channels input: $REQUESTED_CHANNELS" >&2
            exit 2
          }
          [[ "$REQUESTED_PACK_MODE" == "per-channel" || "$REQUESTED_PACK_MODE" == "combined" ]] || exit 2
          [[ "$REQUESTED_CLEANUP_MODE" == "pr" || "$REQUESTED_CLEANUP_MODE" == "direct" ]] || exit 2
          [[ "$REQUESTED_RETENTION_MONTHS" =~ ^[1-9][0-9]*$ ]] || {
            echo "retention_months must be a positive integer" >&2
            exit 2
          }
          (( REQUESTED_RETENTION_MONTHS <= 120 )) || {
            echo "retention_months is unexpectedly large" >&2
            exit 2
          }

          {
            echo "REQUESTED_MONTH=$REQUESTED_MONTH"
            echo "REQUESTED_CHANNELS=$REQUESTED_CHANNELS"
            echo "REQUESTED_PACK_MODE=$REQUESTED_PACK_MODE"
            echo "REQUESTED_CLEANUP_MODE=$REQUESTED_CLEANUP_MODE"
            echo "REQUESTED_RETENTION_MONTHS=$REQUESTED_RETENTION_MONTHS"
            echo "REQUESTED_DRY_RUN=${REQUESTED_DRY_RUN:-true}"
          } >> "$GITHUB_ENV"

      - name: Inventory and build deterministic archives
        id: package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import gzip
          import hashlib
          import io
          import json
          import os
          import re
          import shutil
          import subprocess
          import tarfile
          from pathlib import Path
          from zoneinfo import ZoneInfo

          ROOT = Path.cwd()
          ARCHIVED = ROOT / "archived"
          WORK = ROOT / os.environ["WORK_DIR"]
          MAX_PART = int(os.environ["MAX_UNCOMPRESSED_PART_BYTES"])
          DATE_FILE = re.compile(r"^(?P<date>\d{4}-\d{2}-\d{2})\.(json|csv|md)$")
          CHANNEL = re.compile(r"^[A-Za-z0-9_-]+$")
          SOURCE_COMMIT = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def shift_month(value: str, delta: int) -> str:
              year, month = map(int, value.split("-"))
              index = year * 12 + month - 1 + delta
              return f"{index // 12:04d}-{index % 12 + 1:02d}"

          def month_range(start: str, end: str) -> list[str]:
              result = []
              current = start
              while current <= end:
                  result.append(current)
                  current = shift_month(current, 1)
              return result

          def normalized_tar_info(path: Path, archive_name: str) -> tarfile.TarInfo:
              info = tarfile.TarInfo(archive_name)
              info.size = path.stat().st_size
              info.mode = 0o644
              info.uid = 0
              info.gid = 0
              info.uname = ""
              info.gname = ""
              info.mtime = 0
              return info

          def add_json_member(tar: tarfile.TarFile, name: str, value: object) -> None:
              payload = (json.dumps(value, ensure_ascii=False, indent=2, sort_keys=True) + "\n").encode()
              info = tarfile.TarInfo(name)
              info.size = len(payload)
              info.mode = 0o644
              info.uid = info.gid = 0
              info.uname = info.gname = ""
              info.mtime = 0
              tar.addfile(info, io.BytesIO(payload))

          def build_archive(output: Path, entries: list[dict]) -> None:
              with output.open("wb") as raw:
                  with gzip.GzipFile(filename="", fileobj=raw, mode="wb", compresslevel=9, mtime=0) as zipped:
                      with tarfile.open(fileobj=zipped, mode="w", format=tarfile.PAX_FORMAT) as tar:
                          for entry in entries:
                              source = ROOT / entry["path"]
                              info = normalized_tar_info(source, entry["path"])
                              with source.open("rb") as handle:
                                  tar.addfile(info, handle)
                          add_json_member(tar, "META/files.json", {
                              "schema_version": 1,
                              "files": entries,
                          })

          def partition(entries: list[dict]) -> list[list[dict]]:
              parts: list[list[dict]] = []
              current: list[dict] = []
              current_size = 0
              for entry in entries:
                  if entry["size"] > MAX_PART:
                      raise SystemExit(f"Single file exceeds safe release part size: {entry['path']}")
                  if current and current_size + entry["size"] > MAX_PART:
                      parts.append(current)
                      current = []
                      current_size = 0
                  current.append(entry)
                  current_size += entry["size"]
              if current:
                  parts.append(current)
              return parts

          if not ARCHIVED.is_dir():
              raise SystemExit("archived/ does not exist")

          available_channels = sorted(path.name for path in ARCHIVED.iterdir() if path.is_dir())
          requested_channels = os.environ["REQUESTED_CHANNELS"]
          if requested_channels == "all":
              channels = available_channels
          else:
              channels = requested_channels.split(",")
              missing = sorted(set(channels) - set(available_channels))
              if missing:
                  raise SystemExit(f"Unknown archived channels: {', '.join(missing)}")
          if not channels or any(not CHANNEL.fullmatch(value) for value in channels):
              raise SystemExit("No valid channels were selected")

          now = dt.datetime.now(ZoneInfo("Asia/Shanghai"))
          current_month = f"{now.year:04d}-{now.month:02d}"
          retention = int(os.environ["REQUESTED_RETENTION_MONTHS"])
          cutoff_month = shift_month(current_month, -retention)

          requested_month = os.environ["REQUESTED_MONTH"]
          if requested_month == "auto":
              months = [shift_month(cutoff_month, -1)]
          elif ".." in requested_month:
              start, end = requested_month.split("..", 1)
              if start > end:
                  raise SystemExit("Month range start must not be after the end")
              months = month_range(start, end)
          else:
              months = [requested_month]

          invalid_months = [value for value in months if value >= cutoff_month]
          if invalid_months:
              raise SystemExit(
                  "Refusing to archive retained months: " + ", ".join(invalid_months)
                  + f"; cutoff is {cutoff_month}"
              )

          if WORK.exists():
              shutil.rmtree(WORK)
          (WORK / "months").mkdir(parents=True)

          selected: dict[str, list[dict]] = {month: [] for month in months}
          for channel in channels:
              channel_root = ARCHIVED / channel
              for path in sorted(channel_root.rglob("*")):
                  if not path.is_file():
                      continue
                  match = DATE_FILE.fullmatch(path.name)
                  if not match:
                      continue
                  try:
                      file_date = dt.date.fromisoformat(match.group("date"))
                  except ValueError as exc:
                      raise SystemExit(f"Invalid archive filename date: {path}") from exc
                  month = f"{file_date.year:04d}-{file_date.month:02d}"
                  if month not in selected:
                      continue
                  relative = path.relative_to(ROOT).as_posix()
                  selected[month].append({
                      "path": relative,
                      "channel": channel,
                      "size": path.stat().st_size,
                      "sha256": sha256(path),
                  })

          pack_mode = os.environ["REQUESTED_PACK_MODE"]
          scope_token = "all" if requested_channels == "all" else "-".join(sorted(channels))
          scope_id = f"{pack_mode}-{scope_token}"
          all_delete_entries: dict[str, dict] = {}
          built_months: list[str] = []

          for month in months:
              entries = sorted(selected[month], key=lambda item: item["path"])
              if not entries:
                  continue
              built_months.append(month)
              month_dir = WORK / "months" / month
              month_dir.mkdir(parents=True)

              if pack_mode == "per-channel":
                  groups = [
                      (channel, [entry for entry in entries if entry["channel"] == channel])
                      for channel in channels
                  ]
                  groups = [(name, values) for name, values in groups if values]
              else:
                  groups = [(scope_token, entries)]

              assets = []
              for group_name, group_entries in groups:
                  parts = partition(group_entries)
                  for part_number, part_entries in enumerate(parts, start=1):
                      suffix = "" if len(parts) == 1 else f".part-{part_number:03d}"
                      asset_name = f"awesome-hot-list-{month}-{group_name}{suffix}.tar.gz"
                      asset_path = month_dir / asset_name
                      build_archive(asset_path, part_entries)
                      assets.append({
                          "name": asset_name,
                          "sha256": sha256(asset_path),
                          "size": asset_path.stat().st_size,
                          "file_count": len(part_entries),
                          "channels": sorted({entry["channel"] for entry in part_entries}),
                      })

              manifest = {
                  "schema_version": 1,
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "month": month,
                  "channels": sorted({entry["channel"] for entry in entries}),
                  "pack_mode": pack_mode,
                  "scope_id": scope_id,
                  "file_count": len(entries),
                  "uncompressed_bytes": sum(entry["size"] for entry in entries),
                  "files": entries,
                  "assets": assets,
              }
              manifest_name = f"manifest-{scope_id}.json"
              manifest_path = month_dir / manifest_name
              manifest_path.write_text(
                  json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              sums_name = f"SHA256SUMS-{scope_id}"
              sums_path = month_dir / sums_name
              checksum_lines = [f"{asset['sha256']}  {asset['name']}" for asset in assets]
              checksum_lines.append(f"{sha256(manifest_path)}  {manifest_name}")
              sums_path.write_text("\n".join(checksum_lines) + "\n", encoding="ascii")

              for entry in entries:
                  previous = all_delete_entries.get(entry["path"])
                  if previous and previous["sha256"] != entry["sha256"]:
                      raise SystemExit(f"Conflicting hashes for {entry['path']}")
                  all_delete_entries[entry["path"]] = entry

          delete_list = {
              "schema_version": 1,
              "source_commit": SOURCE_COMMIT,
              "scope_id": scope_id,
              "months": built_months,
              "files": sorted(all_delete_entries.values(), key=lambda item: item["path"]),
          }
          (WORK / "delete-list.json").write_text(
              json.dumps(delete_list, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          has_files = bool(all_delete_entries)
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"has_files={'true' if has_files else 'false'}\n")
              handle.write(f"scope_id={scope_id}\n")
              handle.write(f"months={','.join(built_months)}\n")

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("## Monthly archive plan\n\n")
              handle.write(f"- Current month: `{current_month}`\n")
              handle.write(f"- Cutoff month: `{cutoff_month}`\n")
              handle.write(f"- Selected channels: `{', '.join(channels)}`\n")
              handle.write(f"- Pack mode: `{pack_mode}`\n")
              handle.write(f"- Months with files: `{', '.join(built_months) or 'none'}`\n")
              handle.write(f"- Files: `{len(all_delete_entries)}`\n")
              handle.write(f"- Bytes: `{sum(item['size'] for item in all_delete_entries.values())}`\n")
          PY

      - name: Verify packages by extracting and hashing every file
        if: steps.package.outputs.has_files == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import tarfile
          import tempfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd()
          work = root / os.environ["WORK_DIR"] / "months"

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          for manifest_path in sorted(work.glob("*/manifest-*.json")):
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              expected = {entry["path"]: entry for entry in manifest["files"]}
              seen = set()
              with tempfile.TemporaryDirectory() as directory:
                  target = Path(directory)
                  for asset in manifest["assets"]:
                      asset_path = manifest_path.parent / asset["name"]
                      if sha256(asset_path) != asset["sha256"]:
                          raise SystemExit(f"Archive checksum mismatch: {asset_path}")
                      with tarfile.open(asset_path, "r:gz") as archive:
                          for member in archive.getmembers():
                              pure = PurePosixPath(member.name)
                              if pure.is_absolute() or ".." in pure.parts:
                                  raise SystemExit(f"Unsafe archive member: {member.name}")
                              if member.name == "META/files.json":
                                  continue
                              if not member.isfile() or member.name not in expected:
                                  raise SystemExit(f"Unexpected archive member: {member.name}")
                              extracted = archive.extractfile(member)
                              if extracted is None:
                                  raise SystemExit(f"Cannot read archive member: {member.name}")
                              output = target / member.name
                              output.parent.mkdir(parents=True, exist_ok=True)
                              with output.open("wb") as handle:
                                  shutil.copyfileobj(extracted, handle)
                              if sha256(output) != expected[member.name]["sha256"]:
                                  raise SystemExit(f"Extracted file checksum mismatch: {member.name}")
                              seen.add(member.name)
              missing = sorted(set(expected) - seen)
              if missing:
                  raise SystemExit(f"Files missing from packages: {missing[:10]}")
          PY

      - name: Stop after dry run
        if: steps.package.outputs.has_files == 'true' && env.REQUESTED_DRY_RUN == 'true'
        shell: bash
        run: |
          echo "Dry run completed. No release or branch changes were made." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish and round-trip verify release assets
        if: steps.package.outputs.has_files == 'true' && env.REQUESTED_DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin archive-index >/dev/null 2>&1; then
            git fetch origin refs/heads/archive-index:refs/heads/archive-index
          fi

          create_index_commit() {
            local month="$1"
            local scope="$2"
            local manifest="$3"
            local sums="$4"
            local parent=""
            local index_file
            local manifest_target="releases/${month}/${scope}/manifest.json"
            local sums_target="releases/${month}/${scope}/SHA256SUMS"

            parent="$(git rev-parse --verify refs/heads/archive-index 2>/dev/null || true)"
            if [[ -n "$parent" ]] && git cat-file -e "${parent}:${manifest_target}" 2>/dev/null; then
              local old_manifest old_sums
              old_manifest="$(mktemp)"
              old_sums="$(mktemp)"
              git show "${parent}:${manifest_target}" > "$old_manifest"
              git show "${parent}:${sums_target}" > "$old_sums"
              cmp -s "$old_manifest" "$manifest" && cmp -s "$old_sums" "$sums" || {
                echo "archive-index already contains different immutable metadata for ${month}/${scope}" >&2
                exit 1
              }
              rm -f "$old_manifest" "$old_sums"
              printf '%s\n' "$parent"
              return
            fi

            index_file="$(mktemp)"
            rm -f "$index_file"
            if [[ -n "$parent" ]]; then
              GIT_INDEX_FILE="$index_file" git read-tree "$parent"
            else
              GIT_INDEX_FILE="$index_file" git read-tree --empty
            fi

            local manifest_blob sums_blob tree commit
            manifest_blob="$(git hash-object -w "$manifest")"
            sums_blob="$(git hash-object -w "$sums")"
            GIT_INDEX_FILE="$index_file" git update-index --add --cacheinfo 100644 "$manifest_blob" "$manifest_target"
            GIT_INDEX_FILE="$index_file" git update-index --add --cacheinfo 100644 "$sums_blob" "$sums_target"
            tree="$(GIT_INDEX_FILE="$index_file" git write-tree)"
            if [[ -n "$parent" ]]; then
              commit="$(printf 'archive: index %s %s\n' "$month" "$scope" | git commit-tree "$tree" -p "$parent")"
              git update-ref refs/heads/archive-index "$commit" "$parent"
            else
              commit="$(printf 'archive: initialize index with %s %s\n' "$month" "$scope" | git commit-tree "$tree")"
              git update-ref refs/heads/archive-index "$commit"
            fi
            rm -f "$index_file"
            git push origin refs/heads/archive-index:refs/heads/archive-index
            printf '%s\n' "$commit"
          }

          while IFS= read -r -d '' manifest; do
            directory="$(dirname "$manifest")"
            month="$(jq -r '.month' "$manifest")"
            scope="$(jq -r '.scope_id' "$manifest")"
            sums="$directory/SHA256SUMS-$scope"
            tag="archive-$month"
            index_commit="$(create_index_commit "$month" "$scope" "$manifest" "$sums")"

            if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              git tag "$tag" "$index_commit"
              git push origin "refs/tags/$tag"
            fi

            release_created=false
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" \
                --verify-tag \
                --draft \
                --title "Hot List Archive $month" \
                --notes "Immutable monthly hot-list archives. Verify assets with the attached SHA256SUMS files."
              release_created=true
            fi

            mapfile -t upload_files < <(
              jq -r '.assets[].name' "$manifest" | while IFS= read -r name; do printf '%s\n' "$directory/$name"; done
              printf '%s\n' "$manifest" "$sums"
            )

            mapfile -t existing_assets < <(gh release view "$tag" --json assets --jq '.assets[].name')
            for local_file in "${upload_files[@]}"; do
              name="$(basename "$local_file")"
              if printf '%s\n' "${existing_assets[@]}" | grep -Fqx "$name"; then
                verify_dir="$(mktemp -d)"
                gh release download "$tag" --pattern "$name" --dir "$verify_dir"
                [[ "$(sha256sum "$local_file" | cut -d' ' -f1)" == "$(sha256sum "$verify_dir/$name" | cut -d' ' -f1)" ]] || {
                  echo "Existing release asset differs: $tag / $name" >&2
                  exit 1
                }
                rm -rf "$verify_dir"
              else
                gh release upload "$tag" "$local_file"
              fi
            done

            remote_dir="$(mktemp -d)"
            for local_file in "${upload_files[@]}"; do
              name="$(basename "$local_file")"
              gh release download "$tag" --pattern "$name" --dir "$remote_dir"
            done
            (cd "$remote_dir" && sha256sum -c "$(basename "$sums")")
            [[ "$(sha256sum "$sums" | cut -d' ' -f1)" == "$(sha256sum "$remote_dir/$(basename "$sums")" | cut -d' ' -f1)" ]]
            rm -rf "$remote_dir"

            is_draft="$(gh release view "$tag" --json isDraft --jq '.isDraft')"
            if [[ "$is_draft" == "true" ]]; then
              gh release edit "$tag" --draft=false
            fi
            echo "- Published and verified: [$tag](${{ github.server_url }}/${{ github.repository }}/releases/tag/$tag)" >> "$GITHUB_STEP_SUMMARY"
          done < <(find "$WORK_DIR/months" -name 'manifest-*.json' -print0 | sort -z)

      - name: Delete only release-verified files
        if: steps.package.outputs.has_files == 'true' && env.REQUESTED_DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH"
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse "origin/$DEFAULT_BRANCH")" ]] || {
            echo "Default branch changed while archives were uploaded. Rerun so hashes can be checked against the latest commit." >&2
            exit 1
          }

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path.cwd().resolve()
          delete_list = json.loads((root / os.environ["WORK_DIR"] / "delete-list.json").read_text(encoding="utf-8"))

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          for entry in delete_list["files"]:
              relative = Path(entry["path"])
              if relative.is_absolute() or ".." in relative.parts or not relative.parts or relative.parts[0] != "archived":
                  raise SystemExit(f"Unsafe deletion path: {relative}")
              target = (root / relative).resolve()
              if root not in target.parents:
                  raise SystemExit(f"Deletion path escaped repository: {relative}")
              if not target.is_file():
                  raise SystemExit(f"Release-verified file is missing before deletion: {relative}")
              if sha256(target) != entry["sha256"]:
                  raise SystemExit(f"File changed after packaging: {relative}")

          for entry in delete_list["files"]:
              target = root / entry["path"]
              target.unlink()
              parent = target.parent
              while parent != root / "archived" and parent.is_dir() and not any(parent.iterdir()):
                  parent.rmdir()
                  parent = parent.parent
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- archived
          if git diff --cached --quiet; then
            echo "No tracked archive files needed deletion." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          months="${{ steps.package.outputs.months }}"
          commit_message="archive: move ${months//,/, } to GitHub Releases"
          git commit -m "$commit_message"

          if [[ "$REQUESTED_CLEANUP_MODE" == "direct" ]]; then
            git push origin "HEAD:$DEFAULT_BRANCH"
            echo "- Cleanup commit pushed directly to \`$DEFAULT_BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
          else
            cleanup_branch="archive/cleanup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git switch -c "$cleanup_branch"
            git push origin "$cleanup_branch"
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$cleanup_branch" \
              --title "$commit_message" \
              --body "Release assets were uploaded, downloaded again, and SHA-256 verified before this deletion commit was created. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Cleanup pull request created from \`$cleanup_branch\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report empty selection
        if: steps.package.outputs.has_files != 'true'
        shell: bash
        run: echo "No matching eligible archive files were found; no changes were made." >> "$GITHUB_STEP_SUMMARY"
