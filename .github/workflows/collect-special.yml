name: Collect special hotlists

on:
  schedule:
    # Trigger hourly; collect.py applies each channel's configured interval.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Collect all special channels immediately"
        required: true
        default: false
        type: boolean

concurrency:
  group: hotlist-repository-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
      HOTLIST_RSS_FEEDS: ${{ secrets.HOTLIST_RSS_FEEDS }}
      HOTLIST_RSS_LIMIT: "5"
      ZHIHU_COOKIE: ${{ secrets.ZHIHU_COOKIE }}
      MAIMAI_COOKIE: ${{ secrets.MAIMAI_COOKIE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r src/requirements.txt

      - name: Collect due special channels
        if: github.event_name == 'schedule' || inputs.force != true
        run: python src/script/collect.py special --due

      - name: Collect special channels on demand
        if: github.event_name == 'workflow_dispatch' && inputs.force == true
        run: python src/script/collect.py special

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archived/ site/data/latest.json site/data/reports/today.json
          if git diff --cached --quiet; then
            echo "no special channel data changed"
            exit 0
          fi
          git commit -m "chore: update special hotlists"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push
