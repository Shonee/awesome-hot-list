name: Collect special hotlists

on:
  schedule:
    # Trigger hourly; collect.py applies each channel's configured interval.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Collect all special channels immediately"
        required: true
        default: false
        type: boolean

concurrency:
  group: hotlist-repository-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
      HOTLIST_RSS_FEEDS: ${{ secrets.HOTLIST_RSS_FEEDS }}
      HOTLIST_RSS_LIMIT: "5"
      ZHIHU_COOKIE: ${{ secrets.ZHIHU_COOKIE }}
      MAIMAI_COOKIE: ${{ secrets.MAIMAI_COOKIE }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: app

      - name: Checkout rolling data
        uses: actions/checkout@v5
        with:
          ref: data-pages
          path: runtime

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/src/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r app/src/requirements.txt

      - name: Collect due special channels
        if: github.event_name == 'schedule' || inputs.force != true
        run: >-
          python "$GITHUB_WORKSPACE/app/src/script/collect.py" special --due
          --data-root "$GITHUB_WORKSPACE/runtime"

      - name: Collect special channels on demand
        if: github.event_name == 'workflow_dispatch' && inputs.force == true
        run: >-
          python "$GITHUB_WORKSPACE/app/src/script/collect.py" special
          --data-root "$GITHUB_WORKSPACE/runtime"

      - name: Commit snapshots to data-pages
        run: |
          git -C runtime config user.name "github-actions[bot]"
          git -C runtime config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C runtime add archived/ site/data/latest.json site/data/reports/today.json
          if git -C runtime diff --cached --quiet; then
            echo "no special channel data changed"
            exit 0
          fi
          git -C runtime commit -m "chore: update special hotlists"
          git -C runtime pull --rebase origin data-pages
          git -C runtime push origin HEAD:data-pages
