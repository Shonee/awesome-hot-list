name: Bootstrap data-pages

on:
  workflow_dispatch:

concurrency:
  group: hotlist-repository-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r src/requirements.txt

      - name: Render initial empty site
        run: python src/script/render.py --data-root "$RUNNER_TEMP/hotlist-runtime"

      - name: Create data-pages when absent
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin data-pages >/dev/null 2>&1; then
            echo "data-pages already exists; continuing with verification"
            exit 0
          fi

          source_commit="$(git rev-parse HEAD)"
          git switch --orphan data-pages
          git rm -rf --ignore-unmatch .
          cp -a "$RUNNER_TEMP/hotlist-runtime/site" .
          mkdir -p archived
          touch archived/.gitkeep
          git add archived/.gitkeep site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: initialize empty data-pages from $source_commit"
          git push origin HEAD:data-pages

      - name: Verify data-pages
        run: |
          set -euo pipefail
          git fetch origin data-pages
          test -n "$(git ls-tree -r --name-only origin/data-pages -- site/index.html)"
          test -n "$(git ls-tree -r --name-only origin/data-pages -- site/data/latest.json)"
          test -n "$(git ls-tree -r --name-only origin/data-pages -- site/data/reports/today.json)"
