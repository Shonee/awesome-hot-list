name: Collect hourly hotlists

on:
  schedule:
    # GitHub cron uses UTC; this runs at 07 minutes past every hour.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      channels:
        description: "hourly, all, or comma-separated channel IDs"
        required: true
        default: "hourly"
        type: string

concurrency:
  group: hotlist-repository-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
      CHANNELS: ${{ inputs.channels || 'hourly' }}
      HOTLIST_RSS_FEEDS: ${{ secrets.HOTLIST_RSS_FEEDS }}
      HOTLIST_RSS_LIMIT: "5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r src/requirements.txt

      - name: Collect hourly channels
        run: python src/script/collect.py "$CHANNELS"

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archived/ site/data/latest.json site/data/reports/today.json
          if git diff --cached --quiet; then
            echo "no channel data changed"
            exit 0
          fi
          git commit -m "chore: update hourly hotlists"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push
