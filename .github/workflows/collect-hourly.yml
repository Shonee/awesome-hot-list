name: Collect hourly hotlists

on:
  schedule:
    # GitHub cron uses UTC; this runs at 07 minutes past every hour.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      channels:
        description: "hourly, all, or comma-separated channel IDs"
        required: true
        default: "hourly"
        type: string

concurrency:
  group: hotlist-repository-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
      CHANNELS: ${{ inputs.channels || 'hourly' }}
      HOTLIST_RSS_FEEDS: ${{ secrets.HOTLIST_RSS_FEEDS }}
      HOTLIST_RSS_LIMIT: "5"

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: app

      - name: Checkout rolling data
        uses: actions/checkout@v7
        with:
          ref: data-pages
          path: runtime

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/src/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r app/src/requirements.txt

      - name: Collect hourly channels
        id: collect
        continue-on-error: true
        run: >-
          python "$GITHUB_WORKSPACE/app/src/script/collect.py" "$CHANNELS"
          --data-root "$GITHUB_WORKSPACE/runtime"

      - name: Commit snapshots to data-pages
        if: always()
        run: |
          git -C runtime config user.name "github-actions[bot]"
          git -C runtime config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C runtime add archived/ site/data/latest.json site/data/reports/today.json
          if git -C runtime diff --cached --quiet; then
            echo "no channel data changed"
            exit 0
          fi
          git -C runtime commit -m "chore: update hourly hotlists"
          git -C runtime pull --rebase origin data-pages
          git -C runtime push origin HEAD:data-pages

      - name: Enforce collection health
        if: always()
        run: |
          if [ "${{ steps.collect.outcome }}" != "success" ]; then
            echo "all attempted hourly channels failed; generated failure state was persisted"
            exit 1
          fi
