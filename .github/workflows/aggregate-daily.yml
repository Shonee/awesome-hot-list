name: Aggregate Daily

on:
  schedule:
    # 北京时间每天 00:30 = UTC 前一天 16:30
    - cron: '30 16 * * *'
  workflow_dispatch:

# 与月度归档共用串行组，避免同时改动 archived/ 树导致 push 冲突
concurrency:
  group: archive-data-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install aggregate dependencies
        run: pip install -r ./src/requirements-aggregate.txt

      - name: Install CJK font (gif 中文标签)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Aggregate yesterday's data
        run: python ./src/script/aggregate.py

      - name: Commit aggregated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archived/*/data.json archived/*/gif/
          if git diff --cached --quiet; then
            echo "no aggregated data changed"
            exit 0
          fi
          git commit -m "chore: aggregate rankings $(date -u +'%Y-%m-%d')"
          git pull --rebase origin master
          git push
