name: Archive weekly hot-list data

on:
  schedule:
    # Monday 02:00 Beijing time = Sunday 18:00 UTC.
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify locally without creating a release or updating data-pages"
        required: true
        default: true
        type: boolean
      include_legacy:
        description: "One-time migration: include old JSON, Markdown, GIF, and data.json archive files"
        required: true
        default: false
        type: boolean

concurrency:
  group: hotlist-repository-writer
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
  INCLUDE_LEGACY: ${{ github.event_name == 'schedule' && 'false' || inputs.include_legacy }}

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: app
          fetch-depth: 1

      - name: Checkout rolling data history
        uses: actions/checkout@v7
        with:
          ref: data-pages
          path: runtime
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve archive metadata
        run: |
          echo "SOURCE_COMMIT=$(git -C "$GITHUB_WORKSPACE/app" rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "ARCHIVE_WORK=$RUNNER_TEMP/archive-work" >> "$GITHUB_ENV"

      - name: Build seven-day rolling archive
        id: package
        run: |
          archive_args=(prepare --root "$GITHUB_WORKSPACE/runtime" --retention-days 7 --output-dir "$ARCHIVE_WORK" --source-commit "$SOURCE_COMMIT")
          if [ "$INCLUDE_LEGACY" = "true" ]; then
            archive_args+=(--include-legacy)
          fi
          python "$GITHUB_WORKSPACE/app/src/script/archive.py" "${archive_args[@]}"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          result = json.loads((Path(os.environ["ARCHIVE_WORK"]) / "result.json").read_text(encoding="utf-8"))
          print(f"has_files={str(result['hasFiles']).lower()}")
          print(f"archive_id={result['archiveId']}")
          print(f"end_date={result['endDate']}")
          for index, name in enumerate(result.get("assets", [])):
              print(f"asset_{index}={name}")
          PY

      - name: Verify local archive
        if: steps.package.outputs.has_files == 'true'
        run: python "$GITHUB_WORKSPACE/app/src/script/archive.py" verify --root "$GITHUB_WORKSPACE/runtime" --output-dir "$ARCHIVE_WORK"

      - name: Stop after dry run
        if: env.DRY_RUN == 'true'
        run: echo "Dry run completed. No release or branch changes were made." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish and verify GitHub Release
        if: steps.package.outputs.has_files == 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="archive-${{ steps.package.outputs.archive_id }}"
          archive="$ARCHIVE_WORK/${{ steps.package.outputs.asset_0 }}"
          manifest="$ARCHIVE_WORK/${{ steps.package.outputs.asset_1 }}"
          sums="$ARCHIVE_WORK/${{ steps.package.outputs.asset_2 }}"

          if ! gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GH_REPO" --target "$SOURCE_COMMIT" --draft \
              --title "Hot List Archive through ${{ steps.package.outputs.end_date }}" \
              --notes "Seven-day rolling archive. Assets are verified before data-pages is compacted."
          fi

          for file in "$archive" "$manifest" "$sums"; do
            name="$(basename "$file")"
            if gh release view "$tag" --repo "$GH_REPO" --json assets --jq '.assets[].name' | grep -Fqx "$name"; then
              check_dir="$(mktemp -d)"
              gh release download "$tag" --repo "$GH_REPO" --pattern "$name" --dir "$check_dir"
              cmp -s "$file" "$check_dir/$name" || {
                echo "Existing release asset differs: $tag / $name" >&2
                exit 1
              }
            else
              gh release upload "$tag" --repo "$GH_REPO" "$file"
            fi
          done

          remote_dir="$(mktemp -d)"
          gh release download "$tag" --repo "$GH_REPO" --pattern "$(basename "$archive")" \
            --pattern "$(basename "$manifest")" --pattern "$(basename "$sums")" \
            --dir "$remote_dir"
          (cd "$remote_dir" && sha256sum -c "$(basename "$sums")")
          gh release edit "$tag" --repo "$GH_REPO" --draft=false
          echo "- Published and verified [$tag](${{ github.server_url }}/${{ github.repository }}/releases/tag/$tag)." >> "$GITHUB_STEP_SUMMARY"

      - name: Clean verified files and compact data-pages
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          expected_head="$(git -C "$GITHUB_WORKSPACE/runtime" rev-parse HEAD)"
          git -C "$GITHUB_WORKSPACE/runtime" fetch origin data-pages
          remote_head="$(git -C "$GITHUB_WORKSPACE/runtime" rev-parse origin/data-pages)"
          if [ "$expected_head" != "$remote_head" ]; then
            echo "data-pages changed while archiving; rerun against the current snapshot." >&2
            exit 1
          fi

          if [ "${{ steps.package.outputs.has_files }}" = "true" ]; then
            python "$GITHUB_WORKSPACE/app/src/script/archive.py" clean --root "$GITHUB_WORKSPACE/runtime" --output-dir "$ARCHIVE_WORK"
          fi

          snapshot_dir="$(mktemp -d)"
          if [ -d "$GITHUB_WORKSPACE/runtime/archived" ]; then
            cp -a "$GITHUB_WORKSPACE/runtime/archived" "$snapshot_dir/"
          fi
          cp -a "$GITHUB_WORKSPACE/runtime/site" "$snapshot_dir/"

          git -C "$GITHUB_WORKSPACE/runtime" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE/runtime" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE/runtime" switch --orphan compacted-data-pages
          git -C "$GITHUB_WORKSPACE/runtime" rm -rf --ignore-unmatch .
          if [ -d "$snapshot_dir/archived" ]; then
            cp -a "$snapshot_dir/archived" "$GITHUB_WORKSPACE/runtime/"
            git -C "$GITHUB_WORKSPACE/runtime" add archived
          fi
          cp -a "$snapshot_dir/site" "$GITHUB_WORKSPACE/runtime/"
          git -C "$GITHUB_WORKSPACE/runtime" add site
          git -C "$GITHUB_WORKSPACE/runtime" commit -m "chore: compact seven-day data snapshot"
          git -C "$GITHUB_WORKSPACE/runtime" push \
            --force-with-lease=refs/heads/data-pages:"$expected_head" \
            origin HEAD:data-pages

      - name: Report empty selection
        if: steps.package.outputs.has_files != 'true' && env.DRY_RUN != 'true'
        run: echo "No data older than seven days was found; data-pages was still compacted." >> "$GITHUB_STEP_SUMMARY"

      - name: Report empty dry run
        if: steps.package.outputs.has_files != 'true' && env.DRY_RUN == 'true'
        run: echo "No data older than seven days was found; dry run made no branch changes." >> "$GITHUB_STEP_SUMMARY"
