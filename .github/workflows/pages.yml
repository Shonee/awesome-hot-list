name: Deploy Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Bootstrap data-pages
      - Collect hourly hotlists
      - Collect special hotlists
      - Render Daily Dashboard
      - Archive weekly hot-list data
    types: [completed]
    branches: ["master"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployable snapshot
        uses: actions/checkout@v4
        with:
          ref: data-pages

      - name: Verify static site
        run: |
          test -s site/index.html
          test -s site/data/latest.json
          test -s site/data/reports/today.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
